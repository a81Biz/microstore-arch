# nginx/conf.d/microstore.conf
# Routing de subdominios para desarrollo local.
#
# Prerequisito en Windows (cmd como Administrador, una sola vez):
#   notepad C:\Windows\System32\drivers\etc\hosts
#   Añadir al final:
#     127.0.0.1  client.localhost
#     127.0.0.1  admin.localhost
#
# En macOS/Linux: *.localhost resuelve automáticamente a 127.0.0.1.

# ─────────────────────────────────────────────────────────────────────────────
# localhost → Storefront (catálogo público)
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name localhost;

  location / {
    proxy_pass         http://storefront:4321;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 86400;
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# client.localhost → Client Hub (panel de cliente)
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name client.localhost;

  location / {
    proxy_pass         http://client-hub:5173;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 86400;
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# admin.localhost → Vendor Admin (panel de vendedor)
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name admin.localhost;

  location / {
    proxy_pass         http://vendor-admin:5174;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 86400;
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# api.localhost → Supabase API Gateway (Kong)
# Unifica: /auth/v1  /rest/v1  /realtime/v1  /functions/v1
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name api.localhost;

  location / {
    proxy_pass         http://supabase-kong:8000;
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 86400;
  }
}
