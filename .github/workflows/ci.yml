name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ✅ OPTAR POR NODE.JS 24 AHORA
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Check Architecture Rules
        run: bash src/scripts/check-architecture.sh

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Core Package Tests
        run: |
          cd src/packages/core
          npm run test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.207.9

      - name: Start Supabase Local
        run: cd src && supabase start --exclude studio,inbucket,edge-runtime,imgproxy,logflare,vector
        timeout-minutes: 6

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/packages/core/coverage/